<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ app_name }} | Quiz {{ step }}/{{ total }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Plus Jakarta Sans", sans-serif;
      background: linear-gradient(135deg, #f8f5f0 0%, #f0f8f5 100%);
    }
  </style>
</head>
<body class="min-h-screen text-slate-900 flex items-center justify-center">
  <main class="w-full max-w-4xl px-4 py-6 sm:px-6 lg:px-8 text-center">
    
    <h1 class="mb-12 text-2xl font-bold leading-normal text-slate-900 sm:text-3xl px-4 mx-auto max-w-3xl">{{ question.question }}</h1>

    {% if error %}
    <div class="mx-auto mb-8 max-w-md rounded-2xl border border-rose-200 bg-rose-50 px-5 py-3 text-sm font-semibold text-rose-700">{{ error }}</div>
    {% endif %}

    <form method="post" class="mt-8">
      <div class="mx-auto mb-12 grid max-w-4xl grid-cols-2 gap-4 sm:grid-cols-5">
        {% for opt in choices %}
          {% if opt.value != "" %}
          <div class="relative">
            <input
              type="radio"
              id="opt_{{ loop.index }}"
              name="selected"
              value="{{ opt.value }}"
              class="peer sr-only"
              {% if current_value is not none and (opt.value|float == current_value) %}checked{% endif %}
            >
            <label
              for="opt_{{ loop.index }}"
              class="block cursor-pointer rounded-3xl border-2 border-slate-200 px-4 py-6 text-center font-bold transition-all duration-200 sm:px-3 sm:py-6 bg-white text-slate-500 hover:border-teal-300 hover:shadow-md peer-checked:border-transparent peer-checked:bg-gradient-to-r peer-checked:from-teal-500 peer-checked:to-emerald-500 peer-checked:text-white peer-checked:shadow-xl peer-checked:scale-105"
            >
              <div class="text-3xl sm:text-4xl mb-2">{{ opt.value }}</div>
              <div class="text-[11px] font-bold uppercase tracking-wider opacity-90 sm:text-xs">
                {% if opt.value == "1" %}Belum pernah
                {% elif opt.value == "2" %}Pernah coba
                {% elif opt.value == "3" %}Cukup
                {% elif opt.value == "4" %}Mandiri
                {% elif opt.value == "5" %}Sangat mahir
                {% endif %}
              </div>
            </label>
          </div>
          {% endif %}
        {% endfor %}
      </div>

      <div class="mx-auto flex max-w-lg items-center justify-center gap-4">
        {% if step > 1 %}
        <button
          type="submit"
          name="action"
          value="back"
          class="w-1/3 rounded-full border-2 border-slate-300 bg-transparent px-6 py-4 text-sm font-bold text-slate-600 transition hover:border-slate-400 hover:bg-slate-100"
        >
          Kembali
        </button>
        {% endif %}

        <button
          type="submit"
          name="action"
          value="next"
          class="{{ 'w-2/3' if step > 1 else 'w-full' }} group inline-flex items-center justify-center gap-2 rounded-full bg-gradient-to-r from-teal-500 to-emerald-500 px-6 py-4 text-sm font-bold text-white shadow-xl shadow-teal-500/30 transition-all hover:-translate-y-0.5 hover:shadow-2xl hover:shadow-teal-500/40"
        >
          {{ 'Lihat Hasil Akhir' if step == total else 'Selanjutnya' }}
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
          </svg>
        </button>
      </div>
    </form>
  </main>
</body>
</html>
